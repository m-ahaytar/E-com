services:
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: ecomsite/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8085:8080"
    networks:
      - ecom-network
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

  auth-service:
    build: ./backend/auth-service
    image: ecomsite/auth-service:latest
    container_name: auth-service
    ports: ["8081:8081"]
    environment:
      - SQLITE_DB_PATH=/data/auth-service.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - auth-data:/data
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  product-service:
    build: ./backend/product-service
    image: ecomsite/product-service:latest
    container_name: product-service
    ports: ["8082:8082"]
    environment:
      - SQLITE_DB_PATH=/data/product-service.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - product-data:/data
    networks:
      - ecom-network

  order-service:
    build: ./backend/order-service
    image: ecomsite/order-service:latest
    container_name: order-service
    ports: ["8083:8083"]
    environment:
      - SQLITE_DB_PATH=/data/order-service.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - order-data:/data
    networks:
      - ecom-network

  payment-service:
    build: ./backend/payment-service
    image: ecomsite/payment-service:latest
    container_name: payment-service
    ports: ["8084:8084"]
    environment:
      - SQLITE_DB_PATH=/data/payment-service.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - payment-data:/data
    networks:
      - ecom-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8085
    image: ecomsite/frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - ecom-network
    depends_on:
      - api-gateway

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - ecom-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  ecom-network:
    driver: bridge

volumes:
  auth-data:
  product-data:
  order-data:
  payment-data:
  redis-data:
