services:
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8080"
    networks:
      - ecom-network
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    ports: ["8081:8081"]
    environment:
      - SQLITE_DB_PATH=/data/auth-service.db
    volumes:
      - auth-data:/data
    networks:
      - ecom-network

  product-service:
    build: ./backend/product-service
    container_name: product-service
    ports: ["8082:8082"]
    environment:
      - SQLITE_DB_PATH=/data/product-service.db
    volumes:
      - product-data:/data
    networks:
      - ecom-network

  order-service:
    build: ./backend/order-service
    container_name: order-service
    ports: ["8083:8083"]
    environment:
      - SQLITE_DB_PATH=/data/order-service.db
    volumes:
      - order-data:/data
    networks:
      - ecom-network

  payment-service:
    build: ./backend/payment-service
    container_name: payment-service
    ports: ["8084:8084"]
    environment:
      - SQLITE_DB_PATH=/data/payment-service.db
    volumes:
      - payment-data:/data
    networks:
      - ecom-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8085
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - ecom-network
    depends_on:
      - api-gateway

networks:
  ecom-network:
    driver: bridge

volumes:
  auth-data:
  product-data:
  order-data:
  payment-data:
