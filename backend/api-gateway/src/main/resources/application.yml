server:
  port: 8080

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: deals-route
          uri: http://product-service:8082
          predicates:
            - Path=/deals/**
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/products/**
        - id: category-service
          uri: http://product-service:8082
          predicates:
            - Path=/categories/**
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/orders/**
        - id: cart-service
          uri: http://order-service:8083
          predicates:
            - Path=/cart/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/payments/**
