server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/products/**
        - id: category-service
          uri: http://product-service:8082
          predicates:
            - Path=/categories/**
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/orders/**
        - id: cart-service
          uri: http://order-service:8083
          predicates:
            - Path=/cart/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/payments/**
