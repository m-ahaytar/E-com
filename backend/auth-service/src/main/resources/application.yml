server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:tcp://h2-db:1521/ecomdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  h2:
    console:
      enabled: true
